<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wachtwoord vergeten</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body class="theme-light">
  <main class="auth-shell">
    <section class="auth-panel" style="max-width: 520px; margin: 40px auto;">
      <h2>Wachtwoord vergeten</h2>
      <p>Geef je gebruikersnaam op. We registreren de aanvraag en een beheerder helpt je verder.</p>
      <form id="forgot-form" class="form">
        <label>
          Gebruikersnaam
          <input id="username" type="text" name="username" placeholder="Gebruikersnaam" required />
        </label>
        <button class="button primary" type="submit">Aanvraag versturen</button>
        <button class="link" type="button" onclick="window.location.href='{{ url_for('login') }}'">Terug naar login</button>
      </form>
      <div id="status" style="margin-top: 14px;"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = 'Bezig met versturen...';

      const username = document.getElementById('username').value.trim();
      if (!username) {
        status.textContent = 'Vul een gebruikersnaam in.';
        return;
      }

      try {
        const response = await fetch('{{ url_for("api_wachtwoord_vergeten") }}', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });

        const data = await response.json();
        if (!response.ok) {
          status.textContent = data.error || 'Er ging iets mis.';
          return;
        }

        status.textContent = data.message || 'Aanvraag verstuurd.';
      } catch (error) {
        status.textContent = 'Netwerkfout. Probeer opnieuw.';
      }
    });
  </script>
</body>
</html>
