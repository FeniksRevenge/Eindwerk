# Builds TowerDefense/bot into a single SwarmBot.exe on Windows and publishes it as a
# GitHub Release, so it can be downloaded without installing Python.
name: Build SwarmBot.exe

on:
  push:
    branches: [claude/tower-defense-game-dw8azm]
    paths:
      - "TowerDefense/bot/**"
      - ".github/workflows/build-swarm-bot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r TowerDefense/bot/requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SwarmBot
          --paths TowerDefense/bot
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --hidden-import practice
          --hidden-import fakegame
          --hidden-import cma
          TowerDefense/bot/app.py

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\SwarmBot.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content dist\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item dist\selftest.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SwarmBot
          path: dist/SwarmBot.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: swarm-bot-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SwarmBot build ${{ github.run_number }}
          body: Download SwarmBot.exe below and put it in its own folder (it saves its settings and pictures next to itself).
          files: dist/SwarmBot.exe
          make_latest: true
